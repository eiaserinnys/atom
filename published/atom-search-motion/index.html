<!-- Single-file publication: the approved canvas renderer stays inline so html-publish preserves its complete runtime. -->
<style>
  /* 글자, 간격, 접근성의 토대는 html-make의 Apple 프리셋. 그래프의 모양과 색(--g-*)은 레퍼런스 화면에서 가져온다. */
  :root {
    color-scheme: light;
    --shell: #ffffff;
    --label: #1d1d1f;
    --label-2: #5f6672;
    --label-3: #86868b;
    --sep: rgb(0 0 0 / 12%);
    --sep-strong: rgb(0 0 0 / 24%);
    --material: rgb(255 255 255 / 86%);
    --focus: rgb(0 113 227 / 55%);
    --shadow: 0 12px 40px rgb(0 0 0 / 14%);
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px;
    --radius: 8px;
    --control: 44px;
    --tool: 36px;
    --t-body: 17px; --t-content: 15px; --t-small: 14px; --t-caption: 13px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
    /* 그래프 */
    --g-plot: #eef2f6;
    --g-node: #ffffff;
    --g-node-line: #c2c9d4;
    --g-know: #a4588f;
    --g-know-fill: #eddbe8;
    --g-struct: #4c72ad;
    --g-struct-fill: #d5dfef;
    --g-path: #27468a;
    --g-thin: #a9b2c0;
    --g-low-text: #7d8796;
    --g-low-line: #bfc7d2;
    --g-jev: #d97a1c;
    --g-ok: #1b8a55;
    --g-evidence: #f6b81e;
    --g-evidence-ink: #3a2a00;
    --g-ink: #1d1d1f;
    --g-ink-2: #56606e;
    --g-stop-fill: #fde6c8;
    --g-stop-ink: #a3510a;
    --g-sel-base: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --shell: #1c1c1e; --label: #f5f5f7; --label-2: #b3b8c2; --label-3: #8e8e93;
      --sep: rgb(255 255 255 / 16%); --sep-strong: rgb(255 255 255 / 30%);
      --material: rgb(36 36 38 / 90%); --focus: rgb(41 151 255 / 62%); --shadow: 0 12px 40px rgb(0 0 0 / 50%);
      --g-plot: #12151b; --g-node: #20242c; --g-node-line: #4a5262;
      --g-know: #d195bf; --g-know-fill: #46303f; --g-struct: #8fb0e6; --g-struct-fill: #26344f;
      --g-path: #a9c2f5; --g-thin: #5b6474; --g-low-text: #7c8594; --g-low-line: #4a5261;
      --g-jev: #f0a04a; --g-ok: #4ccf8e; --g-evidence: #f6b81e; --g-evidence-ink: #2b1f00;
      --g-ink: #f5f5f7; --g-ink-2: #b3b8c2; --g-stop-fill: #4a3214; --g-stop-ink: #ffc98a; --g-sel-base: #05070a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --shell: #1c1c1e; --label: #f5f5f7; --label-2: #b3b8c2; --label-3: #8e8e93;
    --sep: rgb(255 255 255 / 16%); --sep-strong: rgb(255 255 255 / 30%);
    --material: rgb(36 36 38 / 90%); --focus: rgb(41 151 255 / 62%); --shadow: 0 12px 40px rgb(0 0 0 / 50%);
    --g-plot: #12151b; --g-node: #20242c; --g-node-line: #4a5262;
    --g-know: #d195bf; --g-know-fill: #46303f; --g-struct: #8fb0e6; --g-struct-fill: #26344f;
    --g-path: #a9c2f5; --g-thin: #5b6474; --g-low-text: #7c8594; --g-low-line: #4a5261;
    --g-jev: #f0a04a; --g-ok: #4ccf8e; --g-evidence: #f6b81e; --g-evidence-ink: #2b1f00;
    --g-ink: #f5f5f7; --g-ink-2: #b3b8c2; --g-stop-fill: #4a3214; --g-stop-ink: #ffc98a; --g-sel-base: #05070a;
  }
  @media (prefers-contrast: more) {
    :root { --sep: rgb(0 0 0 / 40%); --sep-strong: rgb(0 0 0 / 70%); --g-low-text: #5b6472; --g-low-line: #7b8492; --g-thin: #6b7482; --label-2: #3b424d; }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--shell); color: var(--label);
    font: 400 var(--t-content)/1.5 var(--font); font-optical-sizing: auto;
    word-break: keep-all; overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font: inherit; color: inherit; }
  button { touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  .app {
    display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr);
    gap: var(--space-2);
    height: 100dvh; min-height: 560px;
    padding: var(--space-3) max(var(--space-4), env(safe-area-inset-right)) max(var(--space-4), env(safe-area-inset-bottom)) max(var(--space-4), env(safe-area-inset-left));
  }

  /* 머리: 제목, 시안 표시, 표본 고르기, 로그인 자리 */
  .topbar { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control); }
  .topbar h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; letter-spacing: -0.015em; white-space: nowrap; }
  .draft { padding: 2px var(--space-2); border: 1px dashed var(--sep-strong); border-radius: 6px; color: var(--label-2); font-size: var(--t-caption); font-weight: 600; line-height: 1.5; white-space: nowrap; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--sep-strong); border-radius: var(--radius); }
  .seg button { min-width: 48px; height: 32px; padding: 0 var(--space-3); border: 0; border-radius: 6px; background: transparent; color: var(--label-2); font-size: var(--t-small); font-weight: 600; cursor: pointer; position: relative; }
  .seg button::after { content: ""; position: absolute; inset: -6px 0; }
  .seg button[aria-checked="true"] { background: var(--g-path); color: var(--shell); }
  .grow { flex: 1; }
  .btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; height: var(--control); padding: 0 var(--space-4); border: 1px solid var(--sep-strong); border-radius: var(--radius); background: var(--shell); color: var(--label); font-size: var(--t-body); font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; transition: transform 100ms ease-out, opacity 160ms linear; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn.primary { border-color: transparent; background: var(--g-path); color: var(--shell); padding: 0 var(--space-6); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.small { height: var(--tool); padding: 0 var(--space-3); font-size: var(--t-small); position: relative; }
  .btn.small::after { content: ""; position: absolute; inset: -4px 0; }
  .btn.toggle[aria-pressed="true"] { border-color: var(--g-path); color: var(--g-path); box-shadow: inset 0 0 0 1px var(--g-path); }

  /* 검색 */
  .search { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); }
  .search input { width: 100%; min-width: 0; height: var(--control); padding: 0 var(--space-4); border: 1px solid var(--sep-strong); border-radius: var(--radius); background: var(--shell); font-size: var(--t-body); line-height: 1.3; }
  .search input::-webkit-search-cancel-button { display: none; }

  /* 결과: 서버가 끝나는 즉시 채운다. 그래프 재생 위치와 무관하다 */
  .outcome { display: flex; align-items: center; gap: var(--space-3); min-width: 0; min-height: var(--control); }
  .tray { display: flex; flex: 1; min-width: 0; gap: var(--space-2); margin: 0; padding: 2px; list-style: none; overflow-x: auto; scrollbar-width: none; }
  .tray::-webkit-scrollbar { display: none; }
  .tray li { flex: 0 1 auto; min-width: 150px; }
  .rchip { display: inline-flex; align-items: center; gap: var(--space-2); width: 100%; max-width: 340px; height: var(--tool); padding: 0 var(--space-3) 0 var(--space-2); border: 0; border-radius: var(--radius); background: var(--g-evidence); color: var(--g-evidence-ink); font-size: var(--t-content); font-weight: 600; cursor: pointer; position: relative; animation: chip-in 420ms var(--ease) both; animation-delay: calc(var(--i) * 70ms); transition: transform 100ms ease-out; }
  .rchip::after { content: ""; position: absolute; inset: -4px 0; }
  .rchip:active { transform: scale(0.97); }
  .rchip b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 5px; background: rgb(0 0 0 / 14%); font-size: var(--t-caption); font-weight: 700; }
  .rchip span { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rchip i { font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; opacity: 0.78; }
  .tray .none { color: var(--label-2); font-size: var(--t-small); line-height: var(--tool); }
  @keyframes chip-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .more { flex: none; }
  .summary { margin: 0; color: var(--label-2); font-size: var(--t-small); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 그래프 판 */
  .board { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border: 1px solid var(--sep); border-radius: 12px; overflow: hidden; background: var(--shell); }
  .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px var(--space-2); border-bottom: 1px solid var(--sep); }
  .tool { position: relative; display: inline-grid; place-items: center; width: var(--tool); height: var(--tool); padding: 0; border: 1px solid var(--sep-strong); border-radius: var(--radius); background: var(--shell); color: var(--label); cursor: pointer; transition: transform 100ms ease-out, background-color 160ms linear; }
  .tool::after { content: ""; position: absolute; inset: -4px; }
  .tool:active:not(:disabled) { transform: scale(0.94); }
  .tool:disabled { opacity: 0.35; cursor: default; }
  .tool svg { width: 16px; height: 16px; fill: currentColor; stroke: none; }
  .tool svg.line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tool.play { border-color: transparent; background: var(--g-path); color: var(--shell); }
  .count { min-width: 50px; margin-left: 6px; color: var(--g-path); font-size: var(--t-content); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .narr { width: 124px; color: var(--label-2); font-size: var(--t-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scrub { display: flex; flex: 1 1 140px; min-width: 100px; max-width: 420px; height: var(--tool); align-items: center; margin: 0 6px; }
  .scrub input { width: 100%; height: 28px; margin: 0; background: transparent; accent-color: var(--g-path); cursor: pointer; }
  .skip.off { visibility: hidden; }
  .break { display: none; }
  .zoom { min-width: 44px; color: var(--label-2); font-size: var(--t-caption); font-variant-numeric: tabular-nums; text-align: center; }
  .right { display: flex; align-items: center; gap: 6px; margin-left: auto; }

  .stage { position: relative; min-height: 0; overflow: hidden; }
  .plot { position: absolute; inset: 0; background: var(--g-plot); overflow: hidden; touch-action: none; cursor: grab; }
  .plot.dragging { cursor: grabbing; }
  .plot.pointing { cursor: pointer; }
  .plot:focus-visible { outline-offset: -3px; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .legend { position: absolute; left: var(--space-3); bottom: var(--space-2); display: flex; gap: var(--space-3); margin: 0; padding: 3px var(--space-2); border-radius: 6px; background: var(--material); list-style: none; color: var(--label-2); font-size: var(--t-caption); line-height: 1.5; pointer-events: none; }
  .legend li { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend .sw { width: 14px; height: 10px; border: 1.5px solid; border-left-width: 4px; border-radius: 2px; }
  .legend .sw.s { border-color: var(--g-struct); background: var(--g-struct-fill); border-left-style: double; border-left-width: 5px; }
  .legend .sw.k { border-color: var(--g-know); background: var(--g-know-fill); }
  .legend .ln { width: 18px; height: 0; border-top: 2.5px solid var(--g-path); }
  .legend .ln.c { border-top: 1.5px dashed var(--g-thin); }
  .legend .ln.p { border-top: 3px dashed var(--g-evidence); background: var(--g-path); height: 3px; border-top-width: 3px; }
  .btn.small.follow { position: absolute; right: var(--space-3); bottom: var(--space-2); background: var(--material); }

  /* 가리켰을 때만 보이는 근거: Jev에 보낸 글, 점수, 열거나 버린 까닭 */
  .pop { position: absolute; z-index: 3; width: max-content; max-width: min(360px, calc(100% - 16px)); padding: var(--space-2) var(--space-3); border: 1px solid var(--sep); border-radius: 10px; background: var(--material); box-shadow: var(--shadow); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 120ms linear, transform 160ms var(--ease); }
  .pop.on { opacity: 1; transform: none; }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .pop, .sheet { -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); }
  }
  .pop-verdict { display: flex; align-items: baseline; gap: var(--space-2); margin: 0; font-size: var(--t-small); font-weight: 600; }
  .pop-verdict b { font-size: var(--t-body); font-weight: 700; font-variant-numeric: tabular-nums; }
  .pop-verdict.ok b { color: var(--g-path); }
  .pop-verdict.no { color: var(--label-2); }
  .pop-match { margin: 4px 0 0; color: var(--label-2); font-size: var(--t-caption); }
  .sent { margin: 6px 0 0; padding: 6px var(--space-2); border-left: 3px solid var(--g-jev); border-radius: 0 6px 6px 0; background: rgb(127 127 127 / 10%); color: var(--label); font: 400 var(--t-caption)/1.5 var(--font); white-space: pre-wrap; }
  .sent-label { display: block; color: var(--g-jev); font-weight: 700; }

  /* 원문 자리 */
  .sheet { position: absolute; z-index: 4; top: 0; right: 0; bottom: 0; width: min(400px, 100%); display: flex; flex-direction: column; border-left: 1px solid var(--sep); background: var(--material); box-shadow: var(--shadow); transform: translateX(104%); transition: transform 380ms var(--ease); overflow: hidden; }
  .sheet.open { transform: none; }
  .sheet-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2); align-items: start; padding: var(--space-3) var(--space-3) var(--space-2) var(--space-4); }
  .sheet-head h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
  .sheet-head h2:focus { outline: none; }
  .sheet-path { margin: 2px 0 0; color: var(--label-2); font-size: var(--t-small); }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-4) var(--space-4); scrollbar-width: thin; }
  .sheet-body .pop-verdict { margin-bottom: var(--space-2); }
  .sheet details { margin: var(--space-2) 0 var(--space-3); }
  .sheet summary { display: flex; align-items: center; min-height: var(--control); color: var(--g-jev); font-size: var(--t-small); font-weight: 700; cursor: pointer; }
  .sheet .sent { margin-top: 0; }
  .origin { padding-top: var(--space-3); border-top: 1px solid var(--sep); }
  .origin p { margin: 0 0 var(--space-3); font-size: var(--t-body); line-height: 1.6; }
  .skeleton { display: grid; gap: 10px; }
  .skeleton i { display: block; height: 12px; border-radius: 6px; background: rgb(127 127 127 / 16%); }
  .origin-note { margin-top: var(--space-4) !important; color: var(--label-3); font-size: var(--t-caption) !important; }

  @media (max-width: 720px) {
    :root { --tool: 36px; }
    .app { gap: 6px; padding-top: var(--space-2); }
    .topbar { flex-wrap: wrap; gap: var(--space-2); min-height: 0; }
    .topbar h1 { font-size: 18px; }
    .topbar .grow { order: 1; }
    .topbar #login { order: 2; height: 36px; padding: 0 var(--space-3); font-size: var(--t-small); }
    .topbar .seg { order: 3; }
    .btn { padding: 0 var(--space-3); font-size: var(--t-content); }
    .btn.primary { padding: 0 var(--space-4); font-size: var(--t-body); }
    .tray { padding-right: 20px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 20px), transparent); }
    .tray li { flex: none; min-width: 0; }
    .rchip { width: auto; max-width: 250px; }
    .summary .jev { display: none; }
    .toolbar { gap: 4px 5px; padding: 6px; }
    .count { min-width: 0; margin-left: 4px; }
    .narr { width: auto; flex: 1 1 0; min-width: 0; }
    .skip { order: 3; }
    .skip.off { display: none; }
    .break { display: block; order: 4; flex-basis: 100%; height: 0; }
    .scrub { order: 5; flex: 1 1 0; min-width: 0; max-width: none; margin: 0 var(--space-1); }
    .right { order: 6; margin-left: 0; }
    .zoomgroup { display: none; }
    .legend { gap: var(--space-2); }
    .sheet { top: auto; left: 0; width: 100%; max-height: 74%; border-left: 0; border-top: 1px solid var(--sep); border-radius: 16px 16px 0 0; transform: translateY(104%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rchip { animation: none; }
    .btn, .tool, .rchip { transition: opacity 120ms linear; }
    .btn:active:not(:disabled), .tool:active:not(:disabled), .rchip:active { transform: none; opacity: 0.6; }
    .sheet, .pop { transition: opacity 120ms linear; }
    .sheet { transform: none; opacity: 0; }
    .sheet.open { opacity: 1; }
    .pop { transform: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    :root { --material: var(--shell); }
    .pop, .sheet { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  :root[data-reduce-transparency="true"] { --material: var(--shell); }
  @media (forced-colors: active) {
    .seg button[aria-checked="true"], .btn.primary, .tool.play { background: Highlight; color: HighlightText; forced-color-adjust: none; }
    .rchip { border: 2px solid CanvasText; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>atom 검색</h1>
    <span class="grow"></span>
    <p class="summary" id="auth-message" role="alert" hidden></p>
    <button class="btn small" id="retry-auth" type="button" hidden>다시 시도</button>
    <a class="btn" id="login" href="#" hidden>Google로 로그인</a>
    <a class="btn small" id="atom-home" href="#" target="_blank" rel="noopener noreferrer">atom</a>
  </header>

  <form class="search" id="search-form">
    <input id="q" type="search" disabled aria-label="검색어" autocomplete="off" enterkeyhint="search">
    <button class="btn primary" id="go" type="submit" disabled>검색</button>
  </form>

  <div class="outcome">
    <ol class="tray" id="tray" aria-label="선정한 카드"></ol>
    <button class="btn small more" id="more" type="button" hidden>더 찾아보기</button>
    <p class="summary" id="summary"><span id="sum-time"></span><span class="jev" id="sum-jev"></span></p>
  </div>

  <section class="board" aria-label="검색 그래프">
    <div class="toolbar" role="toolbar" aria-label="재생">

          <div><h2 id="sheet-title" tabindex="-1"></h2><p class="sheet-path" id="sheet-path"></p></div>
          <button class="tool" id="sheet-close" type="button" aria-label="닫기" title="닫기"><svg class="line" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>

<script>
(() => {
  "use strict";
  // =====================================================================
  // 승인된 시안의 재생기. 실제 Jev 스트림 사건만 메모리에서 재생한다.
  // =====================================================================
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => mqReduce.matches;
  const ROOT = "__root__";
  let dpr = 1; let W = 0; let H = 0;
  const JEV = new Set(["structure_noul", "content_noul", "sufficiency_noul"]);

  // ------------------------------------------------------------------ 1. 사건을 모델로
  function createModel() {
    return { run: null, policy: null, hit: 0.5, nodes: new Map(), order: [], inflight: new Map(), calls: new Map(), steps: 0, suff: new Map(), asking: null, widen: null, terminal: null, done: null, maxHop: 0, last: null, selThreshold: null };
  }
  function mkNode(o) {
    return Object.assign({ ref: "", nodeId: null, type: "knowledge", title: "", path: [], summary: null, hop: 0, origin: "outline", parent: null, climbFrom: [], score: null, verdict: "pending", byHit: false, selected: false, rank: 0, judging: null, reading: 0, climbing: false, asked: null, snippet: null, again: [], order: 0, childCount: null, physicalParent: null, cardId: null, deferred: false }, o);
  }
  // 사건 하나를 모델에 반영하고, 연출에 쓸 변화 목록을 돌려준다
  function applyEvent(m, ev) {
    const d = ev.data;
    const delta = { event: ev.event, stage: null, hop: 0, added: [], scored: [], opened: [], again: [], selected: [], suff: null };
    if (ev.event === "run") { m.run = d; m.policy = d.policy || {}; m.hit = m.policy.structure_threshold ?? 0.5; return delta; }
    if (ev.event === "step_started") {
      delta.stage = d.stage; delta.hop = d.hop;
      m.inflight.set(d.id, { id: d.id, seq: d.seq, stage: d.stage, hop: d.hop, refs: d.candidate_refs });
      if (d.stage === "structure_noul" || d.stage === "content_noul") for (const r of d.candidate_refs) { const n = m.nodes.get(r); if (n) n.judging = d.id; }
      else if (d.stage === "atom_outline") { const n = m.nodes.get(d.candidate_refs[0] ?? ROOT); if (n) n.reading += 1; }
      else if (d.stage === "hit_parent") for (const r of d.candidate_refs) { const n = m.nodes.get(r); if (n) n.climbing = true; }
      else if (d.stage === "sufficiency_noul") m.asking = { step: d.id, hop: d.hop, refs: d.candidate_refs };
      else if (d.stage === "deferred_scan") { const n = m.nodes.get(d.candidate_refs[0]); if (n) n.reading += 1; }
      m.last = { stage: d.stage, hop: d.hop };
      return delta;
    }
    if (ev.event === "step_completed") {
      const s = d.step; delta.stage = s.stage; delta.hop = s.hop;
      m.inflight.delete(s.id); m.steps += 1;
      if (s.stage !== "selection" && s.stage !== "run_terminal") m.maxHop = Math.max(m.maxHop, s.hop);
      if (d.call) m.calls.set(s.id, d.call);
      if (s.stage === "atom_outline") { const n = m.nodes.get(s.parent_ref ?? ROOT); if (n) n.reading = Math.max(0, n.reading - 1); }
      if (s.stage === "widen") {
        m.widen = { hop: s.hop, reason: s.widen_reason };
        if (!m.nodes.has(ROOT)) { m.nodes.set(ROOT, mkNode({ ref: ROOT, type: "root", title: "루트", hop: Math.max(0, s.hop - 1), verdict: "open", origin: "root" })); delta.added.push(ROOT); }
      }
      const alias = new Set();
      for (const dec of s.decisions) if (dec.action === "alias") alias.add(dec.ref);
      if (s.stage === "deferred_scan") {
        const parentRef = s.parent_ref; const parent = m.nodes.get(parentRef);
        if (parent) { parent.reading = Math.max(0, parent.reading - 1); parent.deferred = false; }
        delta.scan = parentRef;
      }
      const hits = s.stage === "hit_parent" ? s.candidate_refs.filter((r) => m.nodes.has(r)) : [];
      for (const r of hits) m.nodes.get(r).climbing = false;
      for (const c of d.candidates) {
        if (alias.has(c.ref)) continue;
        const parent = c.origin === "outline" ? (c.traversal_parent_ref ?? (m.nodes.has(ROOT) ? ROOT : null)) : c.origin === "hit_parent" ? (c.hit_ref ?? hits[0] ?? null) : null;
        const n = mkNode({ ref: c.ref, nodeId: c.node_id, type: c.card_type, title: c.title, path: c.path, summary: c.summary, hop: c.hop, origin: c.origin, parent, climbFrom: c.origin === "hit_parent" ? (hits.length ? hits : [c.hit_ref].filter(Boolean)) : [], snippet: c.match_snippet ?? null, order: m.order.length, childCount: c.child_count, physicalParent: c.physical_parent_node_id, cardId: c.card_id });
        m.nodes.set(n.ref, n); m.order.push(n.ref); m.maxHop = Math.max(m.maxHop, n.hop); delta.added.push(n.ref);
      }
      for (const dec of s.decisions) {
        if (dec.action === "alias") { const first = m.nodes.get(dec.reused_from_ref); if (first) { first.again.push(s.hop); delta.again.push(first.ref); } continue; }
        const n = m.nodes.get(dec.ref); if (!n) continue;
        if (dec.action === "no_body") n.verdict = "nobody";
        else if (dec.action === "opened_by_hit" || dec.action === "opened_root") { n.score = null; n.verdict = "open"; n.byHit = dec.action === "opened_by_hit"; n.byRoot = dec.action === "opened_root"; delta.opened.push(n.ref); }
        else if (dec.action === "queued" || dec.action === "pruned" || dec.action === "content_scored") {
          n.score = dec.score; n.judging = null; n.asked = { step: s.id, key: dec.question_key };
          n.verdict = dec.action === "queued" ? "open" : dec.action === "pruned" ? "closed" : dec.score >= m.hit ? "hit" : "low";
          delta.scored.push(n.ref); if (n.verdict === "open") delta.opened.push(n.ref);
        }
      }
      for (const ref of s.deferred_refs || []) { const n = m.nodes.get(ref); if (n) n.deferred = true; }
      for (const n of m.nodes.values()) if (n.byHit) {
        n.climbFrom = [...m.nodes.values()].filter((hit) => hit.type === "knowledge" && hit.score >= m.hit && hit.physicalParent === n.nodeId).map((hit) => hit.ref);
      }
      if (s.stage === "sufficiency_noul") {
        const threshold = s.sufficiency_threshold ?? m.policy.sufficiency_threshold ?? 0.7;
        if (typeof s.sufficiency_score === "number") {
          m.suff.set(s.hop, { score: s.sufficiency_score, threshold, ok: s.sufficiency_score >= threshold, refs: s.candidate_refs, step: s.id });
          delta.suff = s.hop;
        }
        m.asking = null;
      }
      if (s.stage === "selection") {
        m.selThreshold = s.selection_threshold ?? null;
        (s.selected_refs || []).forEach((r, i) => { const n = m.nodes.get(r); if (n) { n.selected = true; n.rank = i + 1; delta.selected.push(r); } });
      }
      if (s.stage === "run_terminal") m.terminal = { status: s.terminal_status, code: s.terminal_code ?? null, stop: s.stop_reason ?? null };
      m.last = { stage: s.stage, hop: s.hop };
      return delta;
    }
    if (ev.event === "done") {
      m.done = d;
      m.terminal = { status: d.status, code: d.error ? d.error.code : null, stop: d.stop_reason ?? null };
      let any = false; for (const n of m.nodes.values()) if (n.selected) { any = true; break; }
      if (!any) (d.results || []).forEach((r, i) => { for (const n of m.nodes.values()) if (n.nodeId === r.node_id) { n.selected = true; n.rank = i + 1; delta.selected.push(n.ref); } });
    }
    return delta;
  }
  // 완성 응답(stream 없이 받은 JSON)을 같은 사건 줄로 바꾼다. 순서는 끝난 시각, 같으면 seq
  function eventsFromResponse(res) {
    const byStep = new Map(); for (const c of res.trace.candidates) { if (!byStep.has(c.discovered_in_step_id)) byStep.set(c.discovered_in_step_id, []); byStep.get(c.discovered_in_step_id).push(c); }
    const calls = new Map(res.trace.calls.map((c) => [c.call_id, c]));
    const out = [{ at: Date.parse(res.started_at), k: 0, seq: 0, event: "run", data: res }];
    for (const s of res.trace.steps) {
      out.push({ at: Date.parse(s.started_at), k: 1, seq: s.seq, event: "step_started", data: { id: s.id, seq: s.seq, hop: s.hop, stage: s.stage, started_at: s.started_at, candidate_refs: s.candidate_refs } });
      out.push({ at: Date.parse(s.completed_at ?? s.started_at), k: 2, seq: s.seq, event: "step_completed", data: { step: s, candidates: byStep.get(s.id) || [], call: calls.get(s.call_id) || null } });
    }
    out.sort((a, b) => a.at - b.at || a.seq - b.seq || a.k - b.k);
    out.push({ event: "done", data: res });
    return out.map(({ event, data }) => ({ event, data }));
  }
  const eventTime = (ev) => Date.parse(ev.event === "run" ? ev.data.started_at : ev.event === "step_started" ? ev.data.started_at : ev.event === "done" ? ev.data.completed_at : (ev.data.step.completed_at ?? ev.data.step.started_at));
  const isAlive = (n) => n.type === "root" || n.verdict === "open" || n.verdict === "hit" || n.selected;
  const isDim = (n) => !n.selected && (n.verdict === "closed" || n.verdict === "low" || n.verdict === "nobody");
  function stopLabel(t) {
    if (!t) return "";
    if (t.stop === "sufficient") return "충분함";
    if (t.stop === "exhausted") return "더 열 곳 없음";
    return { CALL_BUDGET: "호출 상한", RUN_TIME_LIMIT: "시간 상한", CANDIDATE_LIMIT: "후보 상한", CANCELLED: "취소" }[t.code] || (t.status === "error" ? "오류" : "끝");
  }
  const hopName = (h) => (h === 0 ? "입구" : "홉 " + h);
  function narrate(m) {
    const l = m.last; if (!l) return "";
    if (l.stage === "run_terminal") return stopLabel(m.terminal);
    if (l.stage === "selection") return "선정";
    const name = { lexical_seed: "낱말 씨앗", structure_noul: "문", content_noul: "채점", sufficiency_noul: "찾았나", hit_parent: "윗구조", atom_outline: "펼침", widen: "그물 넓히기", deferred_scan: "큰 모음 훑기" }[l.stage] || l.stage;
    return hopName(l.hop) + " " + name;
  }

  // ------------------------------------------------------------------ 2. 자리 잡기
  const M = { colW: 220, gap: 150, rowH: 30, pitch: 38, lowPitch: 35, chipH: 22, bandGap: 14, groupGap: 6, padX: 28, padTop: 14, headerH: 46, pileH: 28, pendCap: 14, cell: 5, laneY: -9 };
  const ui = { showLow: true, expanded: new Set(), follow: true };
  const colX = (hop) => hop * (M.colW + M.gap);
  // 열은 홉. 한 열 안에서 위 띠는 살아 있는 것(열린 구조, 맞은 카드, 선정)과 아직 판정 전인 것,
  // 아래 띠는 닫히거나 낮은 것. 넘치는 것은 부모별 더미(+N)로 접는다.
  function layout(m) {
    const pos = new Map(); const piles = new Map(); const hidden = new Map(); const cols = []; const dorm = new Map();
    const byHop = new Map();
    const push = (n) => { if (n.deferred) dorm.set(n.ref, n.childCount); if (!byHop.has(n.hop)) byHop.set(n.hop, []); byHop.get(n.hop).push(n); };
    const root = m.nodes.get(ROOT); if (root) push(root);
    for (const ref of m.order) push(m.nodes.get(ref));
    let height = 0;
    const lastHop = m.run ? Math.max(m.maxHop, 0) : -1;
    const gridCols = Math.floor((M.colW - 16) / M.cell);
    // 입구 하나뿐인 동안에는 씨앗을 여러 줄로 넓게 편다(가장 자주 보는 화면). 다음 홉이 나오면 한 열로 접힌다
    const stride = M.colW + 16;
    const K = lastHop <= 0 && !root && W > 0 ? clamp(Math.floor((W - 2 * M.padX + 16) / stride), 1, 3) : 1;
    const byScore = (a, b) => (b.score ?? 2) - (a.score ?? 2) || a.order - b.order;
    // 더미: 접어 둔 후보가 많으면 점 격자로 그린다. 점 하나가 카드 하나이고 자리는 발견 순서라 바뀌지 않는다
    const placePile = (g, x, yy, hop, rest, foldable) => {
      const segs = [...g.steps.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([id, done]) => ({ id, done }));
      const grid = rest.length > 24;
      const h = grid ? 26 + Math.ceil(g.all.length / gridCols) * M.cell + 5 : M.pileH;
      const parents = g.merged ? [...new Set(rest.map((n) => n.parent).filter(Boolean))] : g.parent ? [g.parent] : [];
      piles.set(g.key, { key: g.key, x, y: yy, h, grid, cells: grid ? g.all : null, cols: gridCols, count: rest.length, expanded: foldable && rest.length === 0, parents, hop, segs, busy: segs.some((sg) => !sg.done) });
      for (const n of rest) hidden.set(n.ref, g.key);
      return h;
    };
    for (let hop = 0; hop <= lastHop; hop += 1) {
      const x = colX(hop);
      const nodes = byHop.get(hop) || [];
      const groups = new Map();
      for (const n of nodes) {
        const key = hop + "|" + (n.type === "root" ? "@root" : n.parent ?? "@seed");
        if (!groups.has(key)) {
          const anchor = n.parent && (pos.get(n.parent) || piles.get(hidden.get(n.parent)));
          groups.set(key, { key, parent: n.type === "root" ? null : n.parent, anchorY: n.type === "root" ? -2 : anchor ? anchor.y : -1, alive: [], pend: [], low: [], nobody: [], steps: new Map(), all: [] });
        }
        const g = groups.get(key); g.all.push(n.ref);
        if (isAlive(n)) g.alive.push(n); else if (n.verdict === "pending") g.pend.push(n); else if (n.verdict === "nobody") g.nobody.push(n); else g.low.push(n);
        if (n.judging) g.steps.set(n.judging, false);
        if (n.asked) g.steps.set(n.asked.step, true);
      }
      let list = [...groups.values()].sort((a, b) => a.anchorY - b.anchorY);
      let y = 0;
      if (hop === 0 && K > 1) {
        const g = list[0] || { key: "0|@seed", parent: null, alive: [], pend: [], low: [], nobody: [], steps: new Map(), all: [] };
        g.alive.sort(byScore); g.low.sort(byScore);
        const rows = (arr, pitch) => { for (let i = 0; i < arr.length; i += K) { const row = arr.slice(i, i + K); row.forEach((n, k) => pos.set(n.ref, { x: x + k * stride, y })); y += pitch + (row.some((n) => n.selected) ? M.chipH + 2 : 0); } };
        rows(g.alive, M.pitch); rows(g.pend, M.pitch);
        const lows = g.low.concat(g.nobody);
        if (lows.length) { if (y > 0) y += M.bandGap; if (ui.showLow) rows(lows, M.lowPitch); else y += placePile(g, x, y, 0, lows, false) + 6; }
        cols.push({ hop, x, height: y, w: K * stride - 16 }); height = Math.max(height, y);
        continue;
      }
      for (const g of list) {
        g.alive.sort(byScore);
        // 구조가 미뤄 둔 묶음이 있으면 그 아래에 칩 한 줄을 둔다
        for (const n of g.alive) { pos.set(n.ref, { x, y }); y += M.pitch + (n.selected || dorm.has(n.ref) ? M.chipH + 2 : 0); }
      }
      // 부모가 많은 열(루트 아래 등)은 판정 전인 줄과 접는 묶음을 열 하나로 합친다
      if (list.length > 4) {
        const all = { key: hop + "|@all", merged: true, parent: null, alive: [], pend: [], low: [], nobody: [], steps: new Map(), all: nodes.filter((n) => n.type !== "root").map((n) => n.ref) };
        for (const g of list) { all.pend.push(...g.pend); all.low.push(...g.low); all.nobody.push(...g.nobody); for (const [id, done] of g.steps) all.steps.set(id, done); }
        all.pend.sort((a, b) => a.order - b.order);
        list = [all];
      }
      const big = list.filter((g) => g.all.length > 1).length;
      const lowCap = list.filter((g) => g.low.length + g.nobody.length > 0).length <= 1 ? 8 : 4;
      const pendCap = big <= 1 ? M.pendCap : Math.max(2, Math.floor(12 / big));
      for (const g of list) {
        const open = ui.expanded.has(g.key);
        const head = new Set(g.all.slice(0, g.all.length > 96 ? 6 : g.merged ? 12 : pendCap));
        g.low.sort(byScore);
        g.lowAll = g.low.concat(g.nobody);
        g.lowVis = open ? g.lowAll : ui.showLow ? g.lowAll.slice(0, lowCap) : [];
        // 판정 전인 줄은 먼저 발견된 몇 장만 보이고 자리를 지킨다. 더미에서 기다리는 카드를 판정 전에 꺼내 보이지 않는다
        g.pendVis = open ? g.pend : g.pend.filter((n) => head.has(n.ref));
        if (g.pend.length - g.pendVis.length === 1 && g.lowAll.length === g.lowVis.length) g.pendVis = g.pend;

    else if (view.focus[0] !== "@" && view.focus[0] !== "#") { const kids = [...model.nodes.values()].filter((n) => (n.parent === cur.ref || n.climbFrom.includes(cur.ref)) && view.L.pos.has(n.ref)).sort((a, b) => view.L.pos.get(a.ref).y - view.L.pos.get(b.ref).y); if (kids.length) target = kids[0].ref; }
    if (!target) { const near = columnItems(hop + (k === "ArrowLeft" ? -1 : 1)).sort((a, b) => Math.abs(a.y - y) - Math.abs(b.y - y))[0]; target = near && near.key; }
    focusKey(target);
  });
  plot.addEventListener("focus", () => { if (plot.matches(":focus-visible") && !view.focus) { const first = columnItems(0)[0]; if (first) focusKey(first.key); } updateHoverKeys(); invalidate(); });
  plot.addEventListener("blur", () => { hidePop(); updateHoverKeys(); invalidate(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheet.hidden && sheet.classList.contains("open")) closeSheet(); });

  // 단추
  $("t-play").addEventListener("click", play);
  $("t-first").addEventListener("click", () => seek(0));
  $("t-prev").addEventListener("click", () => seek(frameOf(player.applied) - (player.frameEnds[frameOf(player.applied) - 1] === player.applied ? 1 : 0)));
  $("t-next").addEventListener("click", () => seek(frameOf(player.applied) + 1));
  $("t-last").addEventListener("click", () => { if (player.serverDone) seek(player.frameEnds.length, false); else skip(); });
  $("t-skip").addEventListener("click", skip);
  $("scrub").addEventListener("input", (e) => seek(Number(e.target.value)));
  $("t-low").addEventListener("click", (e) => { ui.showLow = !ui.showLow; e.currentTarget.setAttribute("aria-pressed", String(ui.showLow)); sync(performance.now(), true, null); });
  $("t-zin").addEventListener("click", () => zoomTo(cam.tz * 1.25));
  $("t-zout").addEventListener("click", () => zoomTo(cam.tz / 1.25));
  $("t-fit").addEventListener("click", fitAll);
  $("t-follow").addEventListener("click", () => { setFollow(true); if (model.last) followHop(model.last.hop); });
  $("sheet-close").addEventListener("click", () => closeSheet());
  $("more").addEventListener("click", () => submitSearch(lastQuery, true));

  const configuredApiOrigin = document.querySelector('meta[name="atom-api-origin"]').content.trim();
  const API_BASE_URL = (configuredApiOrigin || window.location.origin).replace(/\/+$/, "");
  const RETURN_SELECTOR = "atom-search-motion";
  let authenticated = false; let googleAvailable = false; let composing = false;
  let activeSearch = null; let activeCardRequest = null; let searchVersion = 0; let cardVersion = 0; let lastQuery = "";
  $("login").href = API_BASE_URL + "/api/auth/google?return_to=" + encodeURIComponent(RETURN_SELECTOR);
  $("atom-home").href = API_BASE_URL;
  function setAuthMessage(message) { $("auth-message").textContent = message || ""; $("auth-message").hidden = !message; }
  function updateSearchAvailability() { $("q").disabled = $("go").disabled = !authenticated; $("login").hidden = authenticated || !googleAvailable; }
  function errorStatus(status) { const error = new Error("request-failed"); error.status = status; return error; }
  async function getJson(path, signal) {
    const response = await fetch(API_BASE_URL + path, { method: "GET", credentials: "include", cache: "no-store", headers: { Accept: "application/json" }, signal });
    if (!response.ok) throw errorStatus(response.status);
    return response.json();
  }
      function authErrorMessage(code) {
        const messages = {
          "1": "Google 로그인을 완료하지 못했습니다. 다시 시도해 주세요.",
          google_error: "Google 로그인을 완료하지 못했습니다. 다시 시도해 주세요.",
          missing_code: "Google 인증 응답을 확인하지 못했습니다. 다시 로그인해 주세요.",
          invalid_state: "로그인 확인에 실패했습니다. 다시 로그인해 주세요.",
          token_exchange: "Google 인증을 완료하지 못했습니다. 다시 로그인해 주세요.",
          userinfo: "Google 계정 정보를 확인하지 못했습니다. 다시 로그인해 주세요.",
          unauthorized: "이 Google 계정은 atom에 접근할 수 없습니다.",
          deactivated: "이 계정은 atom 접근이 중지되었습니다.",
        };
        return messages[code] || "Google 로그인을 완료하지 못했습니다. 다시 시도해 주세요.";
      }

  function clearPrivateData() {
    searchVersion += 1; if (activeSearch) activeSearch.abort(); activeSearch = null;
    beginRun(); player.playing = false; player.liveStart = 0;
    $("q").value = ""; lastQuery = ""; $("status").textContent = ""; $("graph-live").textContent = "";
    sheetOpener = null; pop.replaceChildren(); pointers.clear(); drag = null; pinch = null;
    chrome();
  }
  function enterLoginState(message) { clearPrivateData(); authenticated = false; updateSearchAvailability(); setAuthMessage(message || ""); }
  async function loadAuthState() {
    $("retry-auth").hidden = true; setAuthMessage("");
    try {
      const providers = await getJson("/api/auth/providers"); googleAvailable = providers && providers.google === true;
      const status = await getJson("/api/auth/status");
      if (!status || status.authenticated !== true) { enterLoginState(googleAvailable ? "" : "Google 로그인을 사용할 수 없습니다."); return; }
      authenticated = true; updateSearchAvailability();
    } catch (error) {
      if (error.status === 401) { enterLoginState(""); return; }
      authenticated = false; updateSearchAvailability(); setAuthMessage("인증 상태를 확인하지 못했습니다."); $("retry-auth").hidden = false;
    }
  }
  function showSearchError(status) {
    const message = status === 403 ? "검색에 접근할 수 없습니다." : status === 429 ? "검색이 많습니다. 잠시 뒤 다시 시도해 주세요." : status === 503 ? "검색을 사용할 수 없습니다. 잠시 뒤 다시 시도해 주세요." : "검색을 완료하지 못했습니다.";
    setAuthMessage(message); $("status").textContent = message;
  }
  async function submitSearch(query, exhaustive = false) {
    if (!authenticated || composing || !query.trim()) return;
    if (activeSearch) activeSearch.abort(); const version = ++searchVersion; const controller = new AbortController(); activeSearch = controller;
    lastQuery = query.trim(); setAuthMessage(""); beginRun();
    const params = new URLSearchParams({ q: lastQuery, engine: "jev", stream: "1" }); if (exhaustive) params.set("exhaustive", "1");
    let reader;
    try {
      const response = await fetch(API_BASE_URL + "/search?" + params, { credentials: "include", cache: "no-store", headers: { Accept: "text/event-stream" }, signal: controller.signal });
      if (!response.ok) throw errorStatus(response.status);
      reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = ""; let finished = false;
      const drain = () => {
        let split;
        while ((split = buffer.search(/\r?\n\r?\n/)) >= 0) {
          const frame = buffer.slice(0, split); const separator = buffer.slice(split).match(/^\r?\n\r?\n/)[0]; buffer = buffer.slice(split + separator.length);
          let event; const data = [];
          for (const line of frame.split(/\r?\n/)) { if (line.startsWith("event:")) event = line.slice(6).trim(); else if (line.startsWith("data:")) data.push(line.slice(5).trimStart()); }
          if (!["run", "step_started", "step_completed", "done"].includes(event)) continue;
          if (version !== searchVersion || controller.signal.aborted) return;
          receive({ event, data: JSON.parse(data.join("\n")) }); if (event === "done") finished = true;
        }
      };
      while (true) {
        const chunk = await reader.read(); if (version !== searchVersion || controller.signal.aborted) return;
        buffer += decoder.decode(chunk.value, { stream: !chunk.done }); drain(); if (chunk.done) break;
      }
      if (!finished) throw new Error("incomplete-stream");
    } catch (error) {
      if (controller.signal.aborted || version !== searchVersion) return;
      if (error.status === 401) { enterLoginState(""); return; }
      clearTimeout(player.timer); clearTimeout(summaryTimer); player.playing = false; showSearchError(error.status); chrome();
    } finally { if (reader) reader.releaseLock(); if (version === searchVersion) activeSearch = null; }
  }
  async function loadOriginal(n, origin) {
    if (activeCardRequest) activeCardRequest.abort(); const version = ++cardVersion; const controller = new AbortController(); activeCardRequest = controller;
    const notice = (text, retry) => {
      origin.replaceChildren(); const p = document.createElement("p"); p.textContent = text; p.setAttribute("role", "status"); origin.append(p);
      if (retry) { const b = document.createElement("button"); b.className = "btn small"; b.textContent = "다시 시도"; b.addEventListener("click", () => loadOriginal(n, origin)); origin.append(b); }
    };
    notice("원문을 불러오고 있습니다.");
    try {
      const card = await getJson("/cards/" + encodeURIComponent(n.cardId), controller.signal);
      if (controller.signal.aborted || version !== cardVersion) return;
      if (!card || String(card.id) !== String(n.cardId)) throw new Error("card-mismatch");
      origin.replaceChildren(); const link = document.createElement("a"); link.className = "btn small"; link.textContent = "atom에서 열기";
      link.href = API_BASE_URL + "/#" + encodeURIComponent(n.nodeId); link.target = "_blank"; link.rel = "noopener noreferrer"; origin.append(link);
      const body = document.createElement("p"); body.style.whiteSpace = "pre-wrap"; body.textContent = typeof card.content === "string" ? card.content : ""; origin.append(body);
    } catch (error) {
      if (controller.signal.aborted || version !== cardVersion) return;
      if (error.status === 401) { enterLoginState(""); return; }
      notice(error.status === 403 ? "원문에 접근할 수 없습니다." : error.status === 404 ? "카드를 찾을 수 없습니다. 결과에서 다시 선택해 주세요." : "원문을 불러오지 못했습니다.", true);
    } finally { if (version === cardVersion) activeCardRequest = null; }
  }
  $("search-form").addEventListener("submit", (event) => { event.preventDefault(); submitSearch($("q").value); });
  $("q").addEventListener("compositionstart", () => { composing = true; });
  $("q").addEventListener("compositionend", () => { composing = false; });
  $("q").addEventListener("keydown", (event) => { if (event.key === "Enter" && (event.isComposing || composing || event.keyCode === 229)) event.preventDefault(); });
  $("retry-auth").addEventListener("click", loadAuthState);
  const pageUrl = new URL(location.href); const initialAuthError = pageUrl.searchParams.get("auth_error");
  if (initialAuthError) history.replaceState(null, "", pageUrl.pathname);
  loadAuthState().then(() => { if (initialAuthError) setAuthMessage(authErrorMessage(initialAuthError)); });

  new ResizeObserver(resize).observe(plot);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTokens(); invalidate(); });
  readTokens(); resize();
  const refit = () => { for (const v of view.nodes.values()) v.fit = null; invalidate(); };
  if (document.fonts) { document.fonts.addEventListener("loadingdone", refit); document.fonts.ready.then(refit); }

})();
</script>
